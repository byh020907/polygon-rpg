<svg xmlns="http://www.w3.org/2000/svg" id="prologue-retrieval-arm" data-rig-family="articulated-machine" viewBox="990 220 130 150">
  <title>Existing prologue retrieval arm — system integration poses, not approved final art</title>
  <g id="dormant-pose" data-pose="dormant" data-replace="whole" data-material="raw-steel" data-normal="0 -1 -0.2" data-shadow="cast">
    <polygon id="dormant-upper" points="1000,240 1104,268 1096,296 994,266" fill="#737a80"/>
    <polygon id="dormant-forearm" points="1078,280 1102,286 1088,352 1066,348" fill="#5c6268" data-normal="0.2 -1 -0.2"/>
    <polygon id="dormant-claw" points="1058,342 1088,344 1082,368 1064,368" fill="#4d5359" data-normal="0 -1 -0.35"/>
    <ellipse id="dormant-elbow" cx="1091" cy="285" rx="13" ry="11" fill="#d0a75e" data-material="brass"/>
    <circle id="dormant-control-marker" data-anchor="control-input" cx="1000" cy="253" r="1"/>
    <circle id="dormant-claw-marker" data-anchor="claw-contact" cx="1073" cy="356" r="1"/>
  </g>
  <g id="captured-pose" data-pose="captured" data-replace="whole" data-material="raw-steel" data-normal="0 -1 -0.2" data-shadow="cast">
