    <polygon id="captured-claw" points="1000,296 1038,302 1034,338 1006,342 996,320" fill="#50565c" data-normal="0 -1 -0.35"/>
    <ellipse id="captured-elbow" cx="1024" cy="290" rx="13" ry="11" fill="#d0a75e" data-material="brass"/>
    <polygon id="captured-signal" points="1046,238 1058,238 1058,247 1046,247" fill="#e0a04a" data-material="brass" data-normal="0 0 -1"/>
    <circle id="captured-control-marker" data-anchor="control-input" cx="1052" cy="243" r="1"/>
    <circle id="captured-claw-marker" data-anchor="claw-contact" cx="1018" cy="320" r="1"/>
    <circle id="captured-rival-marker" data-anchor="rival-grip" cx="1030" cy="320" r="1"/>
  </g>
  <g id="released-pose" data-pose="released" data-replace="whole" data-material="raw-steel" data-normal="0 -1 -0.2" data-shadow="cast">
    <polygon id="released-upper" points="1050,236 1066,248 1050,286 1034,310 1018,300 1034,278" fill="#697077"/>
    <polygon id="released-forearm" points="1032,300 1050,286 1084,320 1070,336" fill="#555b61" data-normal="0.2 -1 -0.2"/>
    <polygon id="released-claw-top" points="1068,324 1098,316 1104,326 1078,338" fill="#484e54" data-normal="0 -1 -0.35"/>
    <polygon id="released-claw-bottom" points="1072,338 1102,342 1098,354 1076,348" fill="#484e54" data-normal="0 -1 -0.35"/>
    <ellipse id="released-elbow" cx="1044" cy="296" rx="13" ry="11" fill="#bd9a5a" data-material="brass"/>
    <polygon id="released-signal" points="1046,238 1058,238 1058,247 1046,247" fill="#6f817f" data-material="brass" data-normal="0 0 -1"/>
