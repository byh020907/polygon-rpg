<svg xmlns="http://www.w3.org/2000/svg" id="prologue-control-core" viewBox="0 0 100 100">
  <title>Existing prologue control core — system integration asset, not new approved art</title>
  <g id="core-body" data-frame="0 0 100 100" data-pivot="50 50" data-normal="0 -1 0" data-material="stone" data-shadow="none">
    <polygon id="core" points="100,75 50,100 0,75 0,25 50,0 100,25" fill="#a7fff0"/>
    <circle id="core-center-marker" data-anchor="interaction" cx="50" cy="50" r="1"/>
    <circle id="core-socket-marker" data-anchor="socket-contact" cx="50" cy="50" r="1"/>
    <circle id="core-output-marker" data-anchor="control-output" cx="100" cy="50" r="1"/>
  </g>
</svg>
